services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: instrutorpro
      POSTGRES_USER: instrutorpro
      POSTGRES_PASSWORD: instrutorpro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instrutorpro -d instrutorpro"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    command: sh -c "python manage.py migrate && python manage.py seed_territories && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/readiness/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: ./backend
    env_file: .env
    command: celery -A config worker --loglevel=INFO
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
  scheduler:
    build: ./backend
    env_file: .env
    command: celery -A config beat --loglevel=INFO
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build: ./frontend
    command: npm start -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
