services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - demo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [private]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ${DEMO_ENV_FILE:-.env.demo}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.demo
    command: ["sh", "/app/docker/entrypoint-demo.sh"]
    volumes:
      - demo_static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; r=urllib.request.Request('http://localhost:8000/api/v1/readiness/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ${DEMO_ENV_FILE:-.env.demo}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.demo
    command: celery -A config worker --loglevel=INFO
    depends_on:
      backend:
        condition: service_healthy
    networks: [private]

  scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ${DEMO_ENV_FILE:-.env.demo}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.demo
    command: celery -A config beat --loglevel=INFO --schedule=/var/lib/celery/celerybeat-schedule
    volumes:
      - demo_celerybeat_data:/var/lib/celery
    depends_on:
      backend:
        condition: service_healthy
    networks: [private]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.demo
    restart: unless-stopped
    volumes:
      - demo_static_data:/var/www/django-static:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [public, private]

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/instrutorpro-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt_config:/etc/letsencrypt:ro
      - letsencrypt_webroot:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - "(while sleep 21600; do nginx -s reload; done) & exec nginx -g 'daemon off;'"
    networks: [public]

  certbot-renew:
    image: certbot/certbot:v5.4.0
    restart: unless-stopped
    volumes:
      - letsencrypt_config:/etc/letsencrypt
      - letsencrypt_webroot:/var/www/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - "while :; do certbot renew --quiet --webroot -w /var/www/certbot; sleep 43200; done"
    networks: [public]

volumes:
  demo_postgres_data:
  demo_redis_data:
  demo_static_data:
  demo_celerybeat_data:
  letsencrypt_config:
  letsencrypt_webroot:

networks:
  public:
  private:
    internal: true
