services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - demo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [private]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ${DEMO_ENV_FILE:-.env.demo}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.demo
    command: ["sh", "/app/docker/entrypoint-demo.sh"]
    volumes:
      - demo_static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/readiness/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ${DEMO_ENV_FILE:-.env.demo}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.demo
    command: celery -A config worker --loglevel=INFO
    depends_on:
      backend:
        condition: service_healthy
    networks: [private]

  scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ${DEMO_ENV_FILE:-.env.demo}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.demo
    command: celery -A config beat --loglevel=INFO --schedule=/var/lib/celery/celerybeat-schedule
    volumes:
      - demo_celerybeat_data:/var/lib/celery
    depends_on:
      backend:
        condition: service_healthy
    networks: [private]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.demo
    restart: unless-stopped
    ports:
      - "${DEMO_BIND_ADDRESS:-0.0.0.0}:${DEMO_HTTP_PORT:-80}:8080"
    volumes:
      - demo_static_data:/var/www/django-static:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [public, private]

volumes:
  demo_postgres_data:
  demo_redis_data:
  demo_static_data:
  demo_celerybeat_data:

networks:
  public:
  private:
    internal: true
