limit_req_zone $binary_remote_addr zone=instrutorpro_admin_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name 179.199.136.4;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 179.199.136.4;

    ssl_certificate /etc/letsencrypt/live/179.199.136.4/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/179.199.136.4/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:InstrutorProTLS:10m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location = /admin/login/ {
        limit_req zone=instrutorpro_admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }
}
