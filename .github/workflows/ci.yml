name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_DB: instrutorpro, POSTGRES_USER: instrutorpro, POSTGRES_PASSWORD: instrutorpro }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U instrutorpro" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgis://instrutorpro:instrutorpro@localhost:5432/instrutorpro
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_ALLOWED_HOSTS: localhost,testserver
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.in }
      - run: pip install -r requirements.in
      - run: ruff format --check .
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate
      - run: pytest
      - run: python manage.py spectacular --file openapi.yaml --validate
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
